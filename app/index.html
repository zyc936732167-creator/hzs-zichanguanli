<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HZS · 工作室资产管理台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23FF5A1F'/%3E%3Ctext x='16' y='23' font-family='Georgia' font-size='20' font-weight='bold' text-anchor='middle' fill='%2314120E'%3EH%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,500;1,9..144,600&family=Schibsted+Grotesk:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="bg-glow" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<div class="app">
  <!-- ░░░ 侧边导航 ░░░ -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">H</div>
      <div class="brand-text">
        <div class="brand-name">HZS</div>
        <div class="brand-sub">ASSET&nbsp;LEDGER</div>
      </div>
    </div>

    <nav class="nav" id="nav">
      <button class="nav-item is-active" data-view="dashboard">
        <span class="nav-idx">01</span>
        <span class="nav-label">资产总览</span>
        <span class="nav-count" id="countDashboard">0</span>
      </button>
      <button class="nav-item" data-view="physical">
        <span class="nav-idx">02</span>
        <span class="nav-label">实体资产</span>
        <span class="nav-count" id="countPhysical">0</span>
      </button>
      <button class="nav-item" data-view="virtual">
        <span class="nav-idx">03</span>
        <span class="nav-label">虚拟资产</span>
        <span class="nav-count" id="countVirtual">0</span>
      </button>
    </nav>

    <div class="side-foot">
      <div class="sync-line" id="syncLine" title="云端实时连接状态">
        <span class="sync-dot connecting" id="syncDot"></span>
        <span id="syncText">正在连接云端…</span>
      </div>
      <p class="foot-note">数据存储在云端数据库，成员改动实时同步。</p>
      <div class="foot-actions">
        <button class="btn btn-ghost btn-sm" id="exportBtn" title="导出 JSON 备份">
          <svg viewBox="0 0 24 24" width="14" height="14"><path d="M12 3v11m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          导出备份
        </button>
        <button class="btn btn-ghost btn-sm" id="importBtn" title="从 JSON 导入到云端">
          <svg viewBox="0 0 24 24" width="14" height="14"><path d="M12 15V4m0 0L8 8m4-4l4 4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          导入
        </button>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
      </div>
      <div class="user-box" id="userBox" hidden>
        <div class="user-id">
          <div class="user-avatar" id="userAvatar">·</div>
          <div class="user-meta">
            <div class="user-email" id="userEmail">—</div>
            <div class="user-role">工作室成员</div>
          </div>
        </div>
        <button class="btn-mini" id="logoutBtn" title="退出登录">
          <svg viewBox="0 0 24 24" width="14" height="14"><path d="M15 4h3a2 2 0 012 2v12a2 2 0 01-2 2h-3M10 8l-4 4 4 4M6 12h12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- ░░░ 主区域 ░░░ -->
  <main class="main">
    <header class="topbar">
      <div class="search-box">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <input type="search" id="searchInput" placeholder="搜索名称 / 编号 / 账号 / 位置 / 备注…" autocomplete="off">
      </div>
      <div class="tb-tools">
        <select class="select" id="statusFilter" title="按状态筛选"></select>
        <select class="select" id="sortSelect" title="排序方式"></select>
        <button class="btn btn-icon" id="revealAllBtn" hidden title="显示 / 隐藏全部密码">
          <svg viewBox="0 0 24 24" width="17" height="17"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
        </button>
        <button class="btn btn-primary" id="addBtn">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
          <span id="addBtnText">新增资产</span>
        </button>
      </div>
    </header>

    <section id="view" class="view"></section>
  </main>
</div>

<!-- ░░░ 登录 / 启动遮罩 ░░░ -->
<div id="authGate" class="auth-gate" hidden>
  <div class="auth-card">
    <div class="auth-brand">
      <div class="brand-mark" aria-hidden="true">H</div>
      <div>
        <div class="brand-name">HZS</div>
        <div class="brand-sub">ASSET LEDGER · 云端版</div>
      </div>
    </div>

    <!-- 登录中 -->
    <div class="auth-pane" data-pane="loading">
      <div class="spinner" aria-hidden="true"></div>
      <p class="auth-tip">正在连接云端资产库…</p>
    </div>

    <!-- 未登录 -->
    <form class="auth-pane" data-pane="form" id="authForm" autocomplete="on">
      <h2 class="auth-title" id="authTitle">工作室成员登录</h2>
      <p class="auth-desc" id="authDesc">登录后可查看与编辑全部资产数据</p>

      <label class="auth-field">
        <span>账号</span>
        <input type="text" id="authEmail" placeholder="用户名 / 邮箱 / 手机号" autocomplete="username" required>
      </label>
      <label class="auth-field">
        <span>密码</span>
        <input type="password" id="authPassword" placeholder="8-32 位，含字母和数字" autocomplete="current-password" minlength="8" required>
      </label>

      <div class="auth-error" id="authError" hidden></div>

      <button type="submit" class="btn btn-primary auth-submit" id="authSubmit">登录</button>
      <p class="auth-note">成员账号由管理员在云开发控制台「身份认证 → 用户管理」中创建</p>
    </form>

    <!-- 配置缺失 -->
    <div class="auth-pane" data-pane="config">
      <h2 class="auth-title">云端尚未配置</h2>
      <p class="auth-desc">请在 <code>js/config.js</code> 中填写腾讯云开发环境 ID（ENV_ID）与 Publishable Key 后刷新页面。</p>
    </div>
  </div>
</div>

<!-- 弹窗 / 确认框 挂载点 -->
<div id="modalRoot"></div>
<div id="toastRoot" class="toast-root" aria-live="polite"></div>

<script src="js/config.js" defer></script>
<script src="js/vendor/cloudbase.full.js" defer></script>
<script src="js/app.js" defer></script>
</body>
</html>
